# 急性前壁心肌梗死整幕思维导图（Case2 终版文字）

## 中心主题

* 急性前壁 ST 段抬高型心肌梗死（STEMI）
  * 刘阿姨病例
  * 病例主线：长期危险因素和劳力性胸痛被忽视，最终发展为 LAD 相关前壁 STEMI；急诊 PCI 后进入长期二级预防阶段

## 1. 病因 / 诱因 / 高危因素 / 一级预防

* 【蓝】疾病基础：冠状动脉粥样硬化
  * 内皮损伤
  * LDL-C 进入血管内膜并发生氧化修饰
  * 单核细胞和炎症细胞浸润
  * 泡沫细胞、脂质核心、纤维帽形成
  * 斑块逐渐造成冠脉狭窄或血流储备下降

* 【红】本病例已经具备的危险因素
  * 53 岁女性
  * 既往高血压
  * 既往糖尿病
  * 长期外卖不断、奶茶不断
  * 第二幕提示血脂异常：LDL-C 升高、TG 升高、HDL-C 降低
  * 近两年劳累后胸闷、胸痛、憋气，休息后缓解

* 【蓝】危险因素如何推动心梗
  * 高血压：内皮损伤、左室后负荷增加、心肌耗氧增加
  * 糖尿病：氧化应激、炎症、内皮功能障碍和动脉粥样硬化加速
  * 血脂异常：LDL-C 促斑块形成，HDL-C 保护作用下降
  * 高盐、高脂、高糖饮食：加重血压、血糖、血脂和体重管理问题

* 【橙】本次急性发作可能的诱因
  * 骑行回家增加心率、血压和心肌耗氧
  * 原有冠脉狭窄基础上，供氧和耗氧失衡加重
  * 若斑块发生破裂或糜烂，可诱发血小板聚集和血栓形成
  * 不能把“骑行”写成唯一病因，它更像触发急性发作的情境因素

* 【蓝】一级预防 / 早期识别
  * 控制血压、血糖、血脂
  * 减少含糖饮料、高盐高脂外卖和总热量摄入
  * 规律运动和体重管理
  * 出现劳力性胸闷胸痛时及时就诊
  * 对高危人群进行心电图、血脂、血糖、肾功能和必要冠脉评估

## 2. 发病机制

* 【蓝】从慢性冠心病到急性 STEMI
  * 长期危险因素推动冠脉粥样硬化
  * 狭窄造成心肌供血储备下降
  * 劳累时心肌耗氧增加，出现短暂可逆缺血
  * 不稳定斑块破裂或糜烂
  * 血小板黏附、激活、聚集
  * 凝血级联反应启动，形成冠脉血栓
  * 冠脉严重狭窄或近闭塞导致心肌持续缺血
  * 缺血时间延长后心肌细胞不可逆坏死

* 【红】第一幕的“机制—表现”对应
  * 近两年劳累后胸闷、胸痛、憋气
  * 休息后缓解，提示慢性供血不足或稳定型心绞痛可能
  * 本次肩背痛、心前区紧缩感、胸口压迫感
  * 大汗和面色苍白提示交感神经兴奋和急性应激
  * 喘不上气和双肺底细湿啰音提示可能合并左心功能受累或肺淤血

* 【蓝】牵涉痛和放射痛机制
  * 心脏内脏感觉传入进入上胸段脊髓
  * 与肩背、上肢、颈部、下颌等体表感觉通路会聚
  * 中枢定位模糊，可把心肌缺血感知为肩背痛、颈痛、下颌痛或牙痛
  * 糖尿病患者还可能出现不典型缺血症状

* 【红】第二幕补齐的解剖机制
  * 冠脉造影发现左前降支约 90% 堵塞
  * LAD 供应左室前壁、心尖和室间隔前部
  * 与 V1-V4 导联异常、急性前壁 STEMI 定位相互印证
  * PCI 后血流改善，说明急性期最关键目标是恢复责任血管灌注

* 【蓝】心肌坏死后的变化
  * 肌细胞膜破坏，肌红蛋白、CK-MB、肌钙蛋白释放
  * 坏死区域启动炎症反应和修复过程
  * 梗死范围越大，左室收缩功能下降和心衰风险越高
  * 远期可能发生心室重构、心功能下降和再发缺血事件

## 3. 诊断 / 危险分层 / 术后监测

* 【蓝】诊断核心框架
  * 急性心肌损伤证据：肌钙蛋白升高并有动态变化
  * 急性缺血证据：缺血性症状、缺血性心电图改变、病理性 Q 波、影像学证据或冠脉血栓证据
  * STEMI 早期处理不能等待所有证据完全返回，应优先争取再灌注时间

* 【红】第一幕已经具备的缺血证据
  * 肩背疼痛
  * 心前区紧缩感
  * 胸口压迫感
  * 大汗、面色苍白
  * 喘不上气
  * V1-V4 导联 QS 波
  * V1-V4 导联 ST 段弓背样抬高
  * 医生判断急性前壁心肌梗死并启动绿色通道

* 【红】第二幕已经具备的确诊和定位证据
  * 冠脉造影：左前降支约 90% 堵塞
  * 已行 PCI 支架治疗
  * 肌红蛋白升高
  * CK、CK-MB 升高
  * cTnT、hsTnI 升高
  * 血脂异常提示动脉粥样硬化危险背景

* 【蓝】需要同步完成的危险分层
  * 生命体征：血压、心率、呼吸、意识、血氧
  * 心电监测：ST 段变化、室速、室颤、传导阻滞等
  * 超声心动图：左室射血分数、室壁运动、机械并发症
  * 肝肾功能：药物剂量、造影剂相关肾损伤和整体风险
  * 电解质：低钾、高钾、低镁等心律失常风险
  * 出血风险：抗栓和穿刺点相关并发症

* 【红】第二幕术后监测重点
  * PCI 后症状是否缓解
  * 心肌标志物是否按时间规律变化
  * 白细胞升高需结合发热、CRP/PCT、穿刺点和影像判断感染或无菌性炎症
  * 肾功能和尿量用于观察造影剂相关损伤风险
  * 穿刺点出血、血肿和假性动脉瘤需要重点观察

* 【蓝】出院前评估
  * 胸痛和缺血症状稳定
  * 血压、血糖、血氧等生命体征相对平稳
  * 无反复缺血、严重心律失常、明显心衰或严重出血
  * 能理解药物方案、复查计划和再发胸痛处理原则

## 4. 鉴别诊断

* 【蓝】稳定型心绞痛
  * 劳累诱发，休息或硝酸甘油后缓解
  * 通常不出现明确心肌坏死标志物升高
  * 【红】刘阿姨近两年症状可作为稳定型心绞痛或慢性冠脉综合征线索

* 【蓝】不稳定型心绞痛 / NSTEMI
  * 同属急性冠脉综合征
  * 不稳定型心绞痛缺乏明确心肌坏死证据
  * NSTEMI 有肌钙蛋白升高但通常无持续 ST 段抬高
  * 【红】本病例 V1-V4 ST 段弓背样抬高和 LAD 严重堵塞，更支持前壁 STEMI

* 【蓝】主动脉夹层
  * 可表现为突发撕裂样胸背痛
  * 需关注双上肢血压差、脉搏差、神经系统症状和主动脉影像
  * 【橙】急诊胸痛不能漏诊，但本病例心电图和冠脉造影证据更偏向 STEMI

* 【蓝】肺栓塞
  * 可有胸痛、气短、低氧、咯血、右心负荷增加
  * D-二聚体、CTPA、超声心动图和下肢静脉超声可辅助判断
  * 【橙】刘阿姨气短需鉴别，但前壁 ST 抬高和 LAD 病变更能解释主线

* 【蓝】心肌炎 / 心包炎
  * 可有胸痛、心肌酶升高和心电图改变
  * 心包炎常有体位相关胸痛和弥漫性 ST 抬高
  * 心肌炎常结合感染前驱、心脏 MRI 和病毒/炎症证据判断

* 【蓝】胃食管反流、胆道疾病、肌肉骨骼疼痛
  * 可造成胸痛、上腹痛或肩背痛
  * 单独存在时容易误导判断
  * 【红】本病例伴大汗、面色苍白、ST 段抬高和心肌标志物升高，不能按普通非心源性疼痛处理

* 【蓝】术后感染 vs 心梗/PCI 后无菌性炎症
  * 心梗后可有白细胞升高和炎症反应
  * 感染需要结合发热、寒战、PCT、CRP、穿刺点、肺部影像和培养
  * 【红】第二幕不能只凭白细胞升高就直接写术后感染

## 5. 治疗 / 二级预防 / 长期管理

* 【蓝】急性期治疗总原则
  * 快速识别 STEMI
  * 尽早再灌注
  * 抗栓治疗
  * 缓解缺血症状
  * 监测并处理并发症
  * 出院后进入长期二级预防

* 【红】本病例已经实施的关键治疗
  * 绿色通道送入介入室
  * 冠状动脉造影明确 LAD 严重病变
  * PCI 支架治疗恢复冠脉血流
  * 术后症状和指标明显好转
  * 出院后继续药物和生活方式管理

* 【蓝】PCI 的定位
  * 诊断：明确责任血管和狭窄程度
  * 治疗：机械性开通梗死相关动脉
  * 目标：缩小梗死范围、改善左室功能和预后
  * 限制：PCI 不能治愈全身动脉粥样硬化

* 【蓝】抗血小板治疗
  * 阿司匹林：不可逆抑制 COX-1，减少血栓烷 A2 生成
  * 氯吡格雷：抑制 ADP-P2Y12 通路，减少血小板聚集
  * 双联抗血小板治疗用于减少支架内血栓和再梗风险
  * 主要风险是胃肠道出血、皮下瘀斑、鼻出血、严重时颅内出血
  * 【红】第三幕：刘阿姨出院后长期服用阿司匹林肠溶片和硫酸氢氯吡格雷

* 【蓝】调脂、降压、降糖
  * 强化调脂：降低 LDL-C、稳定斑块、减缓动脉粥样硬化进展
  * 降压：减少心脏后负荷、内皮损伤和再发事件风险
  * 降糖：减少糖尿病相关血管损害和远期心血管风险
  * 【红】第三幕：医生进行了调脂、降压、降糖治疗

* 【蓝】硝酸甘油与再发胸痛处理
  * 硝酸甘油扩张静脉和冠脉，降低前负荷和心肌耗氧
  * 可用于心绞痛急性发作时舌下含服
  * 不能替代急诊再灌注，不能证明“吃了就没事”
  * 【红】第三幕：再出现心绞痛应立即含服硝酸甘油并马上来医院

* 【蓝】出院后健康管理
  * 低盐、低糖、低脂饮食
  * 按时服药，不自行停抗血小板药
  * 定期复查血压、血糖、血脂、肝肾功能、心电图和心功能
  * 心脏康复和循序渐进运动
  * 识别持续胸痛、大汗、呼吸困难、晕厥等危险信号

## 6. 预后 / 复发风险 / 病例收束

* 【红】本例有利因素
  * 急诊识别了前壁 STEMI
  * 进入绿色通道
  * 明确 LAD 责任病变
  * 完成 PCI 支架治疗
  * PCI 后症状和指标好转
  * 第三幕达到出院标准

* 【红】本例不利因素
  * 高血压和糖尿病长期存在
  * 血脂异常
  * 不健康饮食习惯
  * 近两年劳力性胸闷胸痛未被重视
  * 前壁心梗范围可能较大，需警惕左室功能受损
  * 支架内血栓、再狭窄、再梗和心衰风险仍需长期管理

* 【蓝】影响预后的关键维度
  * 再灌注是否及时
  * 梗死面积和左室射血分数
  * 是否出现心律失常、心衰、休克或机械并发症
  * LDL-C、血压、血糖是否达标
  * 双联抗血小板治疗依从性
  * 是否完成心脏康复和生活方式改变

* 【蓝】三级预防思路
  * 一级预防：在心梗发生前控制危险因素，识别劳力性胸痛
  * 二级预防：心梗后防止再梗、支架血栓、心衰和死亡
  * 三级预防：出现心功能下降或并发症后，尽量改善功能和生活质量

* 【红】整幕最终收束
  * 第一幕：从危险因素、劳力性胸痛和急性 ST 抬高识别前壁 STEMI
  * 第二幕：用冠脉造影、PCI、心肌标志物和围术期监测闭合诊断与治疗证据链
  * 第三幕：从急性抢救转入双抗、调脂、降压、降糖、硝酸甘油应急和长期二级预防
  * 最终理解：刘阿姨不是“支架做完就好了”，而是进入了需要长期管理的冠心病二级预防阶段

            if (text.includes('【红】')) {
              textEl.setAttribute('fill', '#e53e3e');
              textEl.style.fontWeight = 'bold';
            } else if (text.includes('【橙】')) {
              textEl.setAttribute('fill', '#dd6b20');
            } else if (text.includes('【蓝】')) {
              textEl.setAttribute('fill', '#3182ce');
            } else if (text.includes('【灰】')) {
              textEl.setAttribute('fill', '#718096');
            }
            textEl.textContent = text.replace(/【红】|【橙】|【蓝】|【灰】/g, '');
          }
        });

        const htmlEls = g.querySelectorAll('div');
        htmlEls.forEach(el => {
          const html = el.innerHTML;
          if (html.includes('【红】') || html.includes('【橙】') || html.includes('【蓝】') || html.includes('【灰】')) {
            if (html.includes('【红】')) {
              el.style.color = '#e53e3e';
              el.style.fontWeight = 'bold';
            } else if (html.includes('【橙】')) {
              el.style.color = '#dd6b20';
            } else if (html.includes('【蓝】')) {
              el.style.color = '#3182ce';
            } else if (html.includes('【灰】')) {
              el.style.color = '#718096';
            }
            el.innerHTML = html.replace(/【红】|【橙】|【蓝】|【灰】/g, '');
          }
        });
      });
    }, 100);
  </script>
</body>
